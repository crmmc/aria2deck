name: Auto Image Build

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: uv run pytest backend/tests -v --timeout=60
        env:
          PYTHONPATH: backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: bun run test

  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dev 推送：双标签 dev-<sha> + 移动标签 dev（测试服务器固定拉 :dev）
      # main 推送：双标签 <sha> + 移动标签 latest（生产/验证环境拉 :latest）
      - name: Compute image name and tags
        id: vars
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          SHA_TAG="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "tags=${IMAGE}:dev,${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: Summary
        run: |
          echo "Pushed image tags: ${{ steps.vars.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"

