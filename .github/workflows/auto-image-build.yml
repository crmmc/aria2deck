name: Auto Image Build

on:
  push:
    # 任意分支推送都构建镜像（main 打 :latest，其余打分支名标签）
    branches: ["**"]

permissions:
  contents: read

concurrency:
  # 同分支连续 push 取消旧构建，避免 runner 分钟堆积
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: uv run pytest backend/tests -v --timeout=60
        env:
          PYTHONPATH: backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: bun run test

  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main 推送：移动标签 :latest + :<sha>
      # 其余任意分支：移动标签 :<分支名>（/替换为-） + :<sha>，供部署测试
      - name: Compute image name and tags
        id: vars
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          SHA_TAG="${GITHUB_SHA::12}"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "${BRANCH}" = "main" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          else
            # docker 标签字符集 [a-zA-Z0-9._-]，非法字符替换为 -；截断防超 128 字符上限
            SAFE_BRANCH="${BRANCH//[^a-zA-Z0-9._-]/-}"
            SAFE_BRANCH="${SAFE_BRANCH:0:64}"
            echo "tags=${IMAGE}:${SAFE_BRANCH},${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: Summary
        run: |
          echo "Pushed image tags: ${{ steps.vars.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"

