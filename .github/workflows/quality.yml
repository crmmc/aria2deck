name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest/cov95)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check backend/app backend/tests

      - name: Mypy
        run: cd backend && uv run mypy app

      # 显式传参：coverage 从 backend/ 运行时读不到仓库根 pyproject.toml，
      # fail_under/branch 必须显式声明，门禁才真实生效
      - name: Pytest + coverage (>=95%, branch)
        run: >
          cd backend && uv run pytest
          --cov=app --cov-branch --cov-fail-under=95
          --cov-report=term-missing

  frontend:
    name: Frontend (eslint + tsc + jest/cov95)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: ESLint
        working-directory: frontend
        run: bun run lint

      - name: TypeScript
        working-directory: frontend
        run: bunx tsc --noEmit

      # 四指标阈值 95 已在 jest.config.cjs coverageThreshold 中强制
      - name: Jest + coverage
        working-directory: frontend
        run: bun run test -- --runInBand --coverage

  security:
    name: Semgrep (0 findings, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"

      - name: Semgrep
        run: >
          uvx semgrep scan --config auto --error
          backend/app frontend/app frontend/components frontend/hooks frontend/lib

  build:
    name: Static build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Build frontend into backend/static
        run: make build
