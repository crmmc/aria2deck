[project]
name = "aria2-controler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "aiohttp==3.9.5",
    "pydantic-settings==2.3.4",
    "aiosqlite>=0.22.1",
    "greenlet>=3.3.1",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.11.0",
    "zstandard>=0.25.0",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.1",
    "mypy>=1.19.1",
    "ruff>=0.16.5",
]

[tool.coverage.run]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 95

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning:starlette.formparsers",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
# 渐进式启用 strict，先从关键模块开始
[[tool.mypy.overrides]]
module = "app.aria2.*"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# 默认规则之外追加 S（bandit 安全规则子集），不收窄、不豁免
extend-select = ["S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# 测试豁免：断言、夹具凭据与临时路径、种子 sha1、风格与遗留导入噪音全免；
# F821/E9/S501 等真 bug 与严重安全规则仍对测试生效
"backend/tests/**" = [
    "S101", "S105", "S106", "S107", "S108", "S310", "S324", "S603", "S608",
    "F401", "F811", "F841", "RUF012", "RUF059", "RUF100",
    "I001", "E402",
    "SIM102", "SIM114", "SIM117", "SIM222",
    "PLR0402", "PLR1711", "RET501",
    "PIE810", "FLY002", "C401", "C402", "C408", "PERF102",
    "UP035", "UP017", "UP037", "PYI034", "PYI036",
]
