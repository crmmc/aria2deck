# aria2 配置文件 - 本地开发（基于远端生产配置精简迁移）


## 文件保存设置 ##
dir=backend/downloads
disk-cache=128M
file-allocation=none
allow-overwrite=true
continue=true
always-resume=false
max-resume-failure-tries=0

## 进度保存设置 ##
input-file=backend/aria2/aria2.session
save-session=backend/aria2/aria2.session
save-session-interval=1
auto-save-interval=30
force-save=true

## 下载连接设置 ##
max-file-not-found=10
max-tries=10
retry-wait=3
connect-timeout=5
timeout=10
max-concurrent-downloads=64
max-connection-per-server=16
split=8
min-split-size=1M
piece-length=1M
allow-piece-length-change=true
lowest-speed-limit=1k
max-overall-download-limit=0
max-download-limit=0
disable-ipv6=false
http-accept-gzip=true
reuse-uri=true
no-netrc=true
auto-file-renaming=true
content-disposition-default-utf8=true
min-tls-version=TLSv1.2

## BT/PT 下载设置 ##
listen-port=25000
dht-listen-port=25000
enable-dht=true
enable-dht6=true
dht-file-path=backend/aria2/DHT.dat
dht-file-path6=backend/aria2/DHT6.dat
dht-entry-point=dht.transmissionbt.com:6881
dht-entry-point6=dht.transmissionbt.com:6881
bt-enable-lpd=true
bt-stop-timeout=172800
bt-max-open-files=256
enable-peer-exchange=true
bt-max-peers=128
bt-request-peer-speed-limit=100M
max-overall-upload-limit=10M
max-upload-limit=5M
seed-time=0
rpc-save-upload-metadata=true
follow-torrent=true
pause-metadata=false
bt-load-saved-metadata=true
bt-remove-unselected-file=true
bt-detach-seed-only=true
check-integrity=true
bt-seed-unverified=true

# 公共 tracker（来自远端配置的核心集合）
bt-tracker=udp://tracker.openbittorrent.com:6969/announce,udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://tracker.torrent.eu.org:451/announce,udp://tracker.cyberia.is:6969/announce,udp://tracker.moeking.me:6969/announce,udp://tracker.bittor.pw:1337/announce,udp://exodus.desync.com:6969/announce,udp://tracker.tiny-vps.com:6969/announce,udp://tracker2.dler.org:80/announce,http://tracker.open-tracker.org:6969/announce,https://tracker.bt4g.com/announce,http://tracker.torrentyorg.pl:80/announce,http://tracker1.itzmx.com:8080/announce

## RPC 设置 ##
enable-rpc=true
rpc-allow-origin-all=true
rpc-listen-all=true
rpc-listen-port=6801
rpc-secret=1
rpc-max-request-size=16M

## 日志设置 ##
log=backend/aria2/aria2.log
log-level=warn
console-log-level=info
quiet=true
summary-interval=5

## 执行额外命令（本地开发默认关闭，避免干扰后端流程） ##
#on-download-stop=/software/scripts/aria2_protect.py
#on-download-complete=/software/scripts/Aria2DownloadComplete_scripy.py
#on-download-error=/software/scripts/aria2_protect.py
#on-download-start=/software/scripts/aria2_protect.py
