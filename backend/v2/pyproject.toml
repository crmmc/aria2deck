[project]
name = "aria2deck-v2"
version = "0.1.0"
description = "Aria2Deck V2 backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.11.18",
    "aiosqlite==0.21.0",
    "cryptography==44.0.2",
    "fastapi==0.115.12",
    "greenlet==3.1.1",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.2",
    "zstandard==0.25.*",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.11.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria2deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[tool.coverage.run]
branch = true
source = ["aria2deck"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "S", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
